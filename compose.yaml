# Levantar con:  podman-compose up -d
# Las variables se leen del archivo .env (copiarlo de .env.example).
services:
  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-datos}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    ports:
      # Solo accesible desde la propia PC (para herramientas como DBeaver o psql).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datos} -d ${POSTGRES_DB:-datos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/extraccion-datos-economicos:0.2.2
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de Podman la base se llama "db"; esto reemplaza el DATABASE_URL del .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-datos}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  datos_pg:
